name: Run Experiment
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: experiment-runner
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run experiment
        id: experiment
        run: pnpm run experiment -- --count 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAILY_BUDGET_CAP: ${{ vars.DAILY_BUDGET_CAP || '7.50' }}

      - name: Check for new winners
        id: winners
        run: |
          STAGED=$(curl -s "$SUPABASE_URL/rest/v1/staged_configs?promoted=eq.false&select=id,experiment_type,section_type,config,improvement,sample_size,staged_at" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          COUNT=$(echo "$STAGED" | jq 'length')
          echo "staged_count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt "0" ]; then
            echo "### New winning configs found!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$STAGED" | jq -r '.[] | "- **\(.experiment_type)** / \(.section_type): \(.config | tostring) (improvement: \(.improvement), n=\(.sample_size))"' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Go to the [dashboard](https://github.com/${{ github.repository }}) to review and promote." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Create issue for new winners
        if: steps.winners.outputs.staged_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            // Check if there's already an open winner issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'autoresearch-winner',
              state: 'open',
            });

            if (issues.data.length > 0) {
              // Update existing issue with comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `New experiment completed. ${steps.winners.outputs.staged_count} unpromoted winning config(s) waiting for review.\n\nCheck the dashboard to review and promote.`,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🏆 AutoResearch: Winning configs ready for promotion',
                labels: ['autoresearch-winner'],
                body: `## Winning Configurations Found\n\n${steps.winners.outputs.staged_count} config(s) have been statistically validated as improvements over the baseline.\n\n### Next Steps\n\n1. Open the AutoResearch dashboard\n2. Review the staged configs\n3. Click **Promote** on configs you want to deploy\n4. Promoted configs are automatically served via \`GET /api/v1/optimal-config\`\n\nClose this issue after promoting or dismissing all staged configs.`,
              });
            }
